# Takes gdxdump/gdxdiff (and the libraries they load) from the gamspy_base wheels on PyPI, smoke-tests
# them on each platform, tests the extension with them, packages one VSIX per platform (plus a
# universal one without tools) and publishes them on tags.
#
# Runner tags as in the GAMS projects: linux, linux-arm64 (Docker), macos, macos-arm64 (shell),
# windows (shell, PowerShell).

default:
  tags: [linux]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - when: always

stages:
  - fetch-tools
  - smoke-test
  - test
  - package
  - publish

variables:
  GAMSPY_BASE_VERSION:
    value: "54.4.0"
    description: "Release of gamspy_base whose gdxdump and gdxdiff are bundled"
  NODE_IMAGE:
    value: node:22-bookworm
    description: "Image for testing and packaging the extension (Node.js and Python 3)"

#### FETCH THE TOOLS ####

fetch-tools:
  stage: fetch-tools
  image: $NODE_IMAGE
  script:
    # All platforms from their wheels (the Linux x64 tools are smoke-tested here).
    - python3 scripts/fetch-gdx-tools.py --version "$GAMSPY_BASE_VERSION"
  cache:
    key: gamspy-base-$GAMSPY_BASE_VERSION
    paths:
      - tools/.cache/
  artifacts:
    name: "gdx-tools-$GAMSPY_BASE_VERSION"
    paths:
      - tools/linux-x64/
      - tools/linux-arm64/
      - tools/darwin-x64/
      - tools/darwin-arm64/
      - tools/win32-x64/
    expire_in: 1 week

#### SMOKE-TEST THE TOOLS ON THEIR PLATFORM ####

.smoke-test-unix:
  stage: smoke-test
  needs: [fetch-tools]
  # The job shell stops at the first failing command: outputs go to files (no pipes), and the
  # exit code of gdxdiff (1: the files differ) is caught with `|| code=$?`.
  script:
    - chmod +x "tools/$TARGET/gdxdump" "tools/$TARGET/gdxdiff"
    - work=$(mktemp -d)
    - tools/$TARGET/gdxdump test/fixtures/transport1.gdx Symbols > "$work/symbols.txt"
    - grep -q ' x ' "$work/symbols.txt"
    # From the output's directory: gdxdiff writes a temporary file there and renames it.
    - code=0; (cd "$work" && "$CI_PROJECT_DIR/tools/$TARGET/gdxdiff" "$CI_PROJECT_DIR/test/fixtures/transport1.gdx" "$CI_PROJECT_DIR/test/fixtures/transport2.gdx" "$work/diff.gdx") > "$work/diff.log" || code=$?
    - cat "$work/diff.log"
    - test "$code" = 1
    - grep -q 'Data are different' "$work/diff.log"

smoke-test-linux-arm64:
  extends: .smoke-test-unix
  tags: [linux-arm64]
  image: $NODE_IMAGE
  variables:
    TARGET: linux-arm64

smoke-test-darwin-x64:
  extends: .smoke-test-unix
  tags: [macos]
  variables:
    TARGET: darwin-x64

smoke-test-darwin-arm64:
  extends: .smoke-test-unix
  tags: [macos-arm64]
  variables:
    TARGET: darwin-arm64

smoke-test-win32-x64:
  stage: smoke-test
  needs: [fetch-tools]
  tags: [windows]
  script:
    - $symbols = & .\tools\win32-x64\gdxdump.exe test\fixtures\transport1.gdx Symbols
    - if ($LASTEXITCODE -ne 0 -or -not ($symbols -match ' x ')) { $symbols; throw 'gdxdump smoke test failed' }
    - $work = Join-Path ([System.IO.Path]::GetTempPath()) ("gdx-smoke-" + [guid]::NewGuid()); New-Item -ItemType Directory -Path $work | Out-Null
    # From the output's directory: gdxdiff writes a temporary file there and renames it.
    - Push-Location $work; $diff = & "$env:CI_PROJECT_DIR\tools\win32-x64\gdxdiff.exe" "$env:CI_PROJECT_DIR\test\fixtures\transport1.gdx" "$env:CI_PROJECT_DIR\test\fixtures\transport2.gdx" (Join-Path $work 'diff.gdx'); $code = $LASTEXITCODE; Pop-Location
    - $diff
    - if ($code -ne 1 -or -not ($diff -match 'Data are different')) { throw "gdxdiff smoke test failed (exit code $code)" }

#### TEST ####

# The unit tests with the bundled Linux x64 tools.
test:
  stage: test
  image: $NODE_IMAGE
  needs: [fetch-tools]
  script:
    - npm ci
    - npm run compile
    - GDX_TEST_GAMS_DIR="$CI_PROJECT_DIR/tools/linux-x64" node --test "out/test/unit/*.test.js"

#### PACKAGE ####

package:
  stage: package
  image: $NODE_IMAGE
  needs:
    - fetch-tools
    - smoke-test-linux-arm64
    - smoke-test-darwin-x64
    - smoke-test-darwin-arm64
    - smoke-test-win32-x64
    - test
  script:
    - npm ci
    - npm run compile
    - for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64; do scripts/package.sh "$target"; done
    # Without tools, for other platforms: it uses a GAMS or GAMSPy installation.
    - scripts/package.sh universal
    - ls -l dist
  artifacts:
    name: "gdx-analyzer-vsix"
    paths:
      - dist/*.vsix
    expire_in: 1 month

#### PUBLISH ####

# On a tag matching the version in package.json (e.g. v0.9.0 or 0.9.0). Needs the CI/CD variables
# VSCE_PAT (Visual Studio Marketplace) and OVSX_PAT (Open VSX), masked and protected.
.publish:
  stage: publish
  image: $NODE_IMAGE
  needs: [package]
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
    - when: never
  before_script:
    - npm ci
    - version=$(node -p "require('./package.json').version")
    - test "${CI_COMMIT_TAG#v}" = "$version" || { echo "Tag $CI_COMMIT_TAG does not match version $version in package.json"; exit 1; }

publish-marketplace:
  extends: .publish
  script:
    - npx --no-install vsce publish --skip-duplicate --packagePath dist/*.vsix -p "$VSCE_PAT"

publish-open-vsx:
  extends: .publish
  allow_failure: true
  script:
    - for f in dist/*.vsix; do npx --yes ovsx publish "$f" --skip-duplicate -p "$OVSX_PAT"; done
