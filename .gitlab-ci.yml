# Tests the extension, packages it (one VSIX for all platforms: it reads, compares and dumps GDX
# files itself) and publishes it on tags. The tests compare its results with those of gdxdump and
# gdxdiff, taken from the gamspy_base wheel on PyPI (they are not part of the package).

default:
  tags: [linux]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - when: always

stages:
  - test
  - package
  - publish

variables:
  GAMSPY_BASE_VERSION:
    value: "54.4.0"
    description: "Release of gamspy_base whose gdxdump and gdxdiff the tests compare with"
  NODE_IMAGE:
    value: node:22-bookworm
    description: "Image for testing and packaging the extension (Node.js and Python 3)"

#### TEST ####

# The unit tests, with gdxdump and gdxdiff for Linux x64 to compare with.
test:
  stage: test
  image: $NODE_IMAGE
  script:
    - python3 scripts/fetch-gdx-tools.py --version "$GAMSPY_BASE_VERSION" linux-x64
    - npm ci
    - npm run compile
    - GDX_TEST_GAMS_DIR="$CI_PROJECT_DIR/tools/linux-x64" node --test "out/test/unit/*.test.js"
  cache:
    key: gamspy-base-$GAMSPY_BASE_VERSION
    paths:
      - tools/.cache/

#### PACKAGE ####

package:
  stage: package
  image: $NODE_IMAGE
  needs: [test]
  script:
    - npm ci
    - npm run compile
    - scripts/package.sh
    - ls -l dist
  artifacts:
    name: "gdx-analyzer-vsix"
    paths:
      - dist/*.vsix
    expire_in: 1 month

#### PUBLISH ####

# On a tag matching the version in package.json (e.g. v0.9.0 or 0.9.0). Needs the CI/CD variables
# VSCE_PAT (Visual Studio Marketplace) and OVSX_PAT (Open VSX), masked and protected.
.publish:
  stage: publish
  image: $NODE_IMAGE
  needs: [package]
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
    - when: never
  before_script:
    - npm ci
    - version=$(node -p "require('./package.json').version")
    - test "${CI_COMMIT_TAG#v}" = "$version" || { echo "Tag $CI_COMMIT_TAG does not match version $version in package.json"; exit 1; }

publish-marketplace:
  extends: .publish
  script:
    - npx --no-install vsce publish --skip-duplicate --packagePath dist/*.vsix -p "$VSCE_PAT"

publish-open-vsx:
  extends: .publish
  allow_failure: true
  script:
    - for f in dist/*.vsix; do npx --yes ovsx publish "$f" --skip-duplicate -p "$OVSX_PAT"; done
